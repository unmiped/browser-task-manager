<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Browser Task Manager</title>
</head>
<body>
    <button id="clr-button">clr</button>
    <h1 id="title">Browser Task Manager</h1>
    <div id="input">
        <input type="text" id="task-input" placeholder="I need to..." maxlength="75">
        <button id="add-task-button">Add task</button>
    </div>
    <p id="task-message" aria-live="polite"></p>
    <span id="task-stats">Total: 0, Active: 0, Completed: 0</span>
    <div id="space"></div>
    <div id="tasks">
        <p id="empty-state" class="empty-state">No tasks yet. Add one to get started.</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
